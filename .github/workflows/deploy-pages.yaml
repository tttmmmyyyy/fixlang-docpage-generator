name: Deploy documentation to GitHub Pages

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
     
      - name: Install MkDocs
        run: python3 -m pip install -r requirements.txt     

      - name: Download & install LLVM
        run: |
          mkdir -p llvm
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz -O llvm.tar.xz
          tar -xf llvm.tar.xz -C llvm --strip-components=1
          LLVM_PATH="${GITHUB_WORKSPACE}/llvm"
          echo "LLVM_SYS_221_PREFIX=$LLVM_PATH" >> $GITHUB_ENV

      - name: Download Fixlang
        uses: actions/checkout@v4
        with:
          repository: tttmmmyyyy/fixlang
          path: fixlang

      - name: Install Fixlang
        run: cargo install --locked --path fixlang

      - name: Install dependencies
        run: |
          # Required for gmp-fix and mpfr-fix
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Build Markdown files
        run: fix run --allow-preliminary-commands

      - name: Build HTML files
        run: mkdocs build --verbose --clean
     
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./site
